# Builds the ROOM VST3 for Windows on every push, tests it, and uploads the
# plugin as a downloadable artifact (Actions tab -> latest run -> Artifacts).

name: Build Windows VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S plugin -B build -A x64 -DROOM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # --- Tests ---------------------------------------------------------------
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Make test audio
        run: |
          pip install -r requirements.txt
          python examples/make_test_audio.py

      - name: Host test (load room, process, stress parameters, save/reload)
        run: |
          foreach ($room in @("hall_clap", "bottle_tap", "room_tone")) {
            build/room_hosttest_artefacts/Release/room_hosttest.exe build/ROOM_artefacts/Release/VST3/ROOM.vst3 examples/audio/$room.wav examples/audio/melody.wav host_$room.wav
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: pluginval (strictness 10)
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          pluginval/pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --validate build/ROOM_artefacts/Release/VST3/ROOM.vst3
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # --- Package ---------------------------------------------------------------
      - name: Package
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse build/ROOM_artefacts/Release/VST3/ROOM.vst3 package/
          Copy-Item plugin/INSTALL.txt package/

      - uses: actions/upload-artifact@v5
        with:
          name: ROOM-VST3-Windows
          path: package/
          if-no-files-found: error
